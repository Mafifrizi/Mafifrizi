  </text>

  <!-- License Icon & Text -->
  <g transform="translate(205, 102)">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="#94a3b8">
      <path d="M8.75.75a.75.75 0 0 0-1.5 0V2h-.984c-.983 0-1.9.444-2.502 1.209l-.262.33a.75.75 0 0 0 .152 1.05.75.75 0 0 0 1.051-.152l.262-.33c.366-.464.922-.734 1.515-.734H7.25v10.5H5.485c-.983 0-1.9.444-2.502 1.209l-.262.33a.75.75 0 0 0 1.203.898l.262-.33c.366-.464.922-.734 1.515-.734H8.75a.75.75 0 0 0 .75-.75V.75Z"/>
      <path d="M10.515 2.373c.593 0 1.149.27 1.515.734l.262.33a.75.75 0 1 0 1.203-.898l-.262-.33A3.206 3.206 0 0 0 10.515 1H9.5v1.5h1.015ZM10.515 14.373c.593 0 1.149.27 1.515.734l.262.33a.75.75 0 1 0 1.203-.898l-.262-.33A3.206 3.206 0 0 0 10.515 13H9.5v1.5h1.015Z"/>
    </svg>
