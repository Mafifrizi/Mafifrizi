<svg xmlns="http://www.w3.org/2000/svg" width="480" height="130" viewBox="0 0 480 130" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="crimsonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Body with Glowing Crimson Border -->
  <rect x="1.5" y="1.5" width="477" height="127" rx="10" fill="url(#cardBg)" stroke="url(#crimsonBorder)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Repo Icon (Octicon Book) -->
  <g transform="translate(22, 22)">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="#ef4444">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 0 0 1.5h2.5a2.25 2.25 0 0 0 2.25-2.25V.75A2.25 2.25 0 0 0 13.25 0H4.5A4 4 0 0 0 .5 4v10.5a.75.75 0 0 0 1.5 0V4a2.5 2.5 0 0 1 0-.5V2.5Z"/>
      <path d="M4.5 1.5a1 1 0 0 0-1 1V4a1 1 0 0 0 1 1h8V1.5H4.5Z"/>
    </svg>
  </g>

  <!-- Repo Name -->
  <text x="48" y="36" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    Mafifrizi / ARES
  </text>

  <!-- Public Badge -->
  <rect x="188" y="22" width="54" height="18" rx="9" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="215" y="34.5" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
    Public
  </text>

  <!-- 62 Modules Badge -->
  <rect x="372" y="22" width="86" height="18" rx="9" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="415" y="34.5" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
    ⚡ 62 Modules
  </text>

  <!-- Description -->
  <text x="22" y="66" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">
    Automated Red Team Engagement System — Autonomous Active Directory
  </text>
  <text x="22" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400">
    attack graph traversal, adversary emulation &amp; modern EDR telemetry evasion.
  </text>

  <!-- Metadata Row: Language, Stars, Forks, License -->
  <!-- Python Circle -->
  <circle cx="28" cy="109" r="5.5" fill="#3572A5" />
  <text x="39" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">
